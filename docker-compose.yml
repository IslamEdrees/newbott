services:
  freqtrade:
    image: freqtradeorg/freqtrade:2026.9
    container_name: newbott
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./user_data:/freqtrade/user_data
    # الواجهة متاحة على السيرفر نفسه بس (افتحها بـ SSH tunnel)
    ports:
      - "127.0.0.1:8080:8080"
    command: >
      trade
      --logfile /freqtrade/user_data/logs/freqtrade.log
      --db-url sqlite:////freqtrade/user_data/${DB_FILE:-tradesv3.dryrun.sqlite}
      --config /freqtrade/user_data/config.json
      --strategy ScalpStrategy

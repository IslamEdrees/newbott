services:
  freqtrade:
    image: freqtradeorg/freqtrade:2026.9
    container_name: newbott
    restart: unless-stopped
    # حدود الموارد: البوت ما ياخدش أكتر من كده حتى لو السيرفر عليه شغل تاني
    cpus: ${BOT_CPUS:-0.5}
    mem_limit: ${BOT_MEM:-700m}
    memswap_limit: ${BOT_MEM:-700m}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    env_file: .env
    volumes:
      - ./user_data:/freqtrade/user_data
    # الواجهة متاحة على السيرفر نفسه بس (افتحها بـ SSH tunnel)
    ports:
      - "127.0.0.1:8080:8080"
    command: >
      trade
      --logfile /freqtrade/user_data/logs/freqtrade.log
      --db-url sqlite:////freqtrade/user_data/${DB_FILE:-tradesv3.dryrun.sqlite}
      --config /freqtrade/user_data/config.json
      --strategy ${STRATEGY:-SmartStrategy}
